name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_infrastructure:
        description: 'Deploy infrastructure'
        required: false
        default: false
        type: boolean
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - prod

permissions:
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-west-2.amazonaws.com
  EKS_CLUSTER_NAME: insurance-platform-dev
  TF_VERSION: 1.16.5
  TFLINT_VERSION: v0.59.1

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # required by codeql-action/upload-sarif on private repos
      security-events: write # upload Trivy SARIF to GitHub code scanning
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      if: always() && github.event_name != 'pull_request_target'
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Upload Trivy scan results as artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: trivy-results
        path: trivy-results.sarif
        retention-days: 30

  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/claims-api
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27'
        cache-dependency-path: apps/claims-api/go.sum

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: go test -v ./...

    - name: Run go vet
      run: go vet ./...

    - name: Install staticcheck
      # Use master until a release supports the Go 1.27 export data format
      run: go install honnef.co/go/tools/cmd/staticcheck@master

    - name: Run staticcheck
      run: staticcheck ./...

  react-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/client-portal
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: 'apps/client-portal/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run tests
      run: npm test -- --coverage --watchAll=false

    - name: Build application
      run: npm run build

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      with:
        tflint_version: ${{ env.TFLINT_VERSION }}

    - name: Terraform Format Check
      run: terraform fmt -check -recursive terraform/

    - name: Init TFLint
      run: tflint --init --config "$GITHUB_WORKSPACE/terraform/.tflint.hcl"

    - name: TFLint (Dev)
      run: tflint --config "$GITHUB_WORKSPACE/terraform/.tflint.hcl" --chdir terraform/environments/dev

    - name: TFLint (Prod)
      run: tflint --config "$GITHUB_WORKSPACE/terraform/.tflint.hcl" --chdir terraform/environments/prod

    - name: Terraform Init (Dev)
      run: |
        cd terraform/environments/dev
        terraform init -backend=false

    - name: Terraform Validate (Dev)
      run: |
        cd terraform/environments/dev
        terraform validate

    - name: Terraform Init (Prod)
      run: |
        cd terraform/environments/prod
        terraform init -backend=false

    - name: Terraform Validate (Prod)
      run: |
        cd terraform/environments/prod
        terraform validate

  docker-build:
    needs: [go-test, react-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.AWS_ENABLED != 'true'
    strategy:
      matrix:
        service: [claims-api, client-portal]
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build Docker image
      run: |
        cd apps/${{ matrix.service }}
        docker build -t ${{ matrix.service }}:${{ github.sha }} .

  build-and-push:
    needs: [security-scan, go-test, react-test, terraform-validate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.AWS_ENABLED == 'true'
    strategy:
      matrix:
        service: [claims-api, client-portal]
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

    - name: Create ECR repository if it doesn't exist
      run: |
        aws ecr describe-repositories --repository-names insurance-platform/${{ matrix.service }} --region ${{ env.AWS_REGION }} || \
        aws ecr create-repository --repository-name insurance-platform/${{ matrix.service }} --region ${{ env.AWS_REGION }}

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REPOSITORY: insurance-platform/${{ matrix.service }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd apps/${{ matrix.service }}
        docker build -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .
        docker tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
        docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
        docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

  deploy-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.AWS_ENABLED == 'true'
    permissions:
      contents: write # git-auto-commit-action pushes updated image tags
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Update image tags in Kubernetes manifests
      env:
        IMAGE_TAG: ${{ github.sha }}
      run: |
        if [ -f "apps/claims-api/deployments/k8s/deployment.yaml" ]; then
          sed -i "s|image: .*claims-api:.*|image: ${{ env.ECR_REGISTRY }}/insurance-platform/claims-api:${{ env.IMAGE_TAG }}|g" apps/claims-api/deployments/k8s/deployment.yaml
        fi

        if [ -f "apps/client-portal/deployments/k8s/deployment.yaml" ]; then
          sed -i "s|image: .*client-portal:.*|image: ${{ env.ECR_REGISTRY }}/insurance-platform/client-portal:${{ env.IMAGE_TAG }}|g" apps/client-portal/deployments/k8s/deployment.yaml
        fi

        if [ -f "argo/applications/claims-api.yaml" ]; then
          sed -i "s|tag: .*|tag: ${{ env.IMAGE_TAG }}|g" argo/applications/claims-api.yaml
        fi

        if [ -f "argo/applications/client-portal.yaml" ]; then
          sed -i "s|tag: .*|tag: ${{ env.IMAGE_TAG }}|g" argo/applications/client-portal.yaml
        fi

    - name: Commit and push updated manifests
      uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
      with:
        commit_message: 'ci: update image tags to ${{ github.sha }}'
        file_pattern: 'apps/*/deployments/k8s/deployment.yaml argo/applications/*.yaml'
        commit_user_name: github-actions[bot]
        commit_user_email: github-actions[bot]@users.noreply.github.com

  deploy-infrastructure:
    needs: terraform-validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[deploy-infra]') && vars.AWS_ENABLED == 'true'
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Init
      run: |
        cd terraform/environments/dev
        terraform init

    - name: Terraform Plan
      run: |
        cd terraform/environments/dev
        terraform plan -no-color -out=tfplan

    - name: Terraform Apply
      run: |
        cd terraform/environments/dev
        terraform apply -auto-approve tfplan

  notify:
    needs: [deploy-dev]
    runs-on: ubuntu-latest
    if: always() && (success() || failure()) && github.ref == 'refs/heads/main'
    steps:
    - name: Determine status
      id: status
      run: |
        if [[ "${{ needs.deploy-dev.result }}" == "success" ]]; then
          echo "status=SUCCESS" >> $GITHUB_OUTPUT
          echo "color=good" >> $GITHUB_OUTPUT
        else
          echo "status=FAILED" >> $GITHUB_OUTPUT
          echo "color=danger" >> $GITHUB_OUTPUT
        fi

    - name: Slack Notification
      uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3.19.0
      if: env.SLACK_WEBHOOK_URL != ''
      with:
        status: custom
        custom_payload: |
          {
            "channel": "#deployments",
            "attachments": [{
              "color": "${{ steps.status.outputs.color }}",
              "title": "Deployment ${{ steps.status.outputs.status }}",
              "fields": [
                {
                  "title": "Repository",
                  "value": "${{ github.repository }}",
                  "short": true
                },
                {
                  "title": "Branch",
                  "value": "${{ github.ref_name }}",
                  "short": true
                },
                {
                  "title": "Commit",
                  "value": "${{ github.sha }}",
                  "short": true
                },
                {
                  "title": "Author",
                  "value": "${{ github.actor }}",
                  "short": true
                }
              ]
            }]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  deploy-production:
    needs: [security-scan, go-test, react-test, terraform-validate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && vars.AWS_ENABLED == 'true'
    environment: production
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Plan (Production)
      run: |
        cd terraform/environments/prod
        terraform init
        terraform plan -no-color

    - name: Manual Approval Required
      run: echo "Manual approval required for production deployment"
